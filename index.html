<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JP TEXTILE ETHIOPIA PLC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f4f6f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .brand {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #1e3a8a;
      letter-spacing: 2px;
      margin-bottom: 40px;
      font-family: "Arial Black", "Microsoft YaHei", Arial, sans-serif;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1200px;
      width: 100%;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      text-decoration: none;
      color: #222;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 2px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      border-color: #2563eb;
    }
    .card .icon {
      font-size: 56px;
      margin-bottom: 16px;
      line-height: 1;
    }
    .card h2 {
      font-size: 20px;
      color: #1e3a8a;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .card p {
      font-size: 13px;
      color: #888;
    }
    .copyright {
      position: fixed;
      bottom: 10px;
      right: 15px;
      font-size: 12px;
      color: #999;
      pointer-events: none;
      user-select: none;
    }
    .copyright .at {
      font-size: 6px;
      vertical-align: super;
      margin-left: 1px;
    }
  </style>
</head>
<body>
  <div class="brand">JP TEXTILE ETHIOPIA PLC</div>

  <div class="cards">
    <a class="card" href="dyeing/index.html">
      <div class="icon">🎨</div>
      <h2>染色化学品仓库</h2>
      <p>Dyeing Chemical Warehouse</p>
    </a>
    <a class="card" href="sizing/index.html">
      <div class="icon">🧪</div>
      <h2>浆料化学品仓库</h2>
      <p>Sizing Chemical Warehouse</p>
    </a>
    <a class="card" href="finishing/index.html">
      <div class="icon">✨</div>
      <h2>后整理化学品仓库</h2>
      <p>Finishing Chemical Warehouse</p>
    </a>
    <a class="card" href="inventory/index.html">
      <div class="icon">🧴</div>
      <h2>化学品总仓库</h2>
      <p>Chemical Warehouse (All)</p>
    </a>
    <a class="card" href="yarn/index.html">
      <div class="icon">🧵</div>
      <h2>坯纱仓库</h2>
      <p>Yarn Warehouse</p>
    </a>
    <a class="card" href="fg/index.html">
      <div class="icon">📦</div>
      <h2>成品仓库</h2>
      <p>Finished Goods</p>
    </a>
  </div>

  <div class="copyright">weiminguo<span class="at">@</span></div>
</body>
</html>
